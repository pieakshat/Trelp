[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
remappings = [
    "forge-std/=../lib/forge-std/src/",
    "solmate/=../lib/solmate/src/",
]
libs = ["../lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
