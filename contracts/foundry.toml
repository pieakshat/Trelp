[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
remappings = [
    "forge-std/=../lib/forge-std/src/",
    "solmate/=../lib/solmate/",
    "v4-core/=../lib/v4-core/",
    "@uniswap/v4-core/=../lib/v4-core/",
    "v4-periphery/=../lib/v4-periphery/",
    "openzeppelin-contracts/=../lib/v4-core/lib/openzeppelin-contracts/",
    "permit2/=../lib/v4-periphery/lib/permit2/",
]
libs = ["../lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
